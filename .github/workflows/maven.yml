name: Test Calendar

on:
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-24.04 # Playwright of e2e-tests has no Chromium for newer Ubuntu releases yet

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # runs the unit and browserless tests and installs the addons, which the E2E app resolves from the local repository
    - name: Test and install addons
      run: mvn -B install -pl addon,addon-scheduler -am

    - name: Install Playwright system dependencies
      run: cd e2e-tests && npx playwright install-deps chromium

    - name: Run E2E integration tests
      run: mvn -B clean verify -Pit --file e2e-test-app/pom.xml

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: e2e-tests/playwright-report/
        retention-days: 7
